apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-demo-page
data:
  index.html: |
    <!doctype html>
    <html lang="pt-BR">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>GitOps com Argo CD</title>
      </head>
      <body>
        <h1>GitOps com Argo CD</h1>
        <p>Esta página é servida pelo Nginx no Kubernetes.</p>
        <p>O estado desejado está versionado no Git. O Argo CD acompanha as alterações e sincroniza o cluster.</p>
        <p>Durante a demonstração, o Deployment muda de 2 para 4 réplicas após um commit e push.</p>
      </body>
    </html>
